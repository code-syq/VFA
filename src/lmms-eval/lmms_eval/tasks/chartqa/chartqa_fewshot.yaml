# ChartQA few-shot variant using HuggingFaceM4/ChartQA (has train split)
#
# Differences from chartqa.yaml:
#   - dataset_path: HuggingFaceM4/ChartQA (has train/val/test splits)
#   - Field names differ: query (not question), label (not answer), human_or_machine (not type)
#   - Uses utils_fewshot.py to handle the field mapping
#   - fewshot_split: train (28K examples)
#
# Usage:
#   --tasks chartqa_fewshot --num_fewshot N
#
dataset_path: HuggingFaceM4/ChartQA
dataset_kwargs:
  token: True
task: "chartqa_fewshot"
test_split: test
training_split: train
fewshot_split: train
fewshot_config:
  sampler: first_n
output_type: generate_until
doc_to_visual: !function utils_fewshot.chartqa_fewshot_doc_to_visual
doc_to_text: !function utils_fewshot.chartqa_fewshot_doc_to_text
doc_to_target: !function utils_fewshot.chartqa_fewshot_doc_to_target
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  do_sample: False
process_results: !function utils_fewshot.chartqa_fewshot_process_results
metric_list:
  - metric: relaxed_overall
    aggregation: mean
    higher_is_better: true
  - metric: relaxed_human_split
    aggregation: mean
    higher_is_better: true
  - metric: relaxed_augmented_split
    aggregation: mean
    higher_is_better: true
metadata:
  - version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question with a single word."
  qwen_vl:
    pre_prompt: ""
    post_prompt: " Answer:"
