### model
model_name_or_path: /nfsdata/syq/models/vlms/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: true

### dataset
dataset_dir: /nfsdata/syq/LLaMA-Factory/src/LLaMA-Factory/data
media_dir: /nfsdata/syq/LLaMA-Factory/src/LLaMA-Factory/data
dataset: wemath2_standard_sft
template: qwen2_vl
cutoff_len: 2048
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /nfsdata/syq/models/continued_sft/qwen25vl_original_wemath2_projector_sft
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

